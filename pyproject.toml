[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-flow"
version = "3.10.0"
description = "Stateful, resumable, auditable pipeline for agentic coding — requirements to design to tasks to code to review, with human checkpoints and one commit per task."
readme = "README.en.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ding An" }]
keywords = [
    "agentic-coding", "ai-agents", "codex", "llm-orchestration",
    "developer-tools", "goose", "workflow-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
ai-dev-flow = "ai_dev_flow.cli:main"

[project.urls]
Homepage = "https://github.com/293498733/AI_A_PLANT"
Repository = "https://github.com/293498733/AI_A_PLANT"
Changelog = "https://github.com/293498733/AI_A_PLANT/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ai_dev_flow*"]

[tool.setuptools.package-data]
ai_dev_flow = [
    "data/pipeline.yaml",
    "data/recipes/steps/*.yaml",
    "data/profiles/*.yml",
]
